server {
	listen 8080;
	host 127.0.0.1;
	root www;
	index index.html index.htm;
	client_max_body_size 1048576;
	methods GET POST;

	location /www/ {
		root ../;
		methods GET;
	}

	location /getonly {
		root /www/dir;
		methods GET;
	}

	location /delete {
		root www/delete;
		methods DELETE;
	}

	location /upload {
		client_max_body_size 1048576;
		upload_enable on;
		upload_store /upload;
		methods POST;
	}

	location /upload/limited {
		client_max_body_size 5;
		upload_enable on;
		upload_store /upload;
		methods POST;
	}

	location /legacy {
		return 301 /Fame.mp3;
	}
}

server {
	listen 8081;
	host 127.0.0.1;
	root /var/www/foo-server;
	index foo;
	methods GET;
}
