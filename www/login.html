<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 2rem; background: #eef1f7; }
    form { background: white; padding: 1.5rem; border-radius: 8px; max-width: 320px; }
    label { display: block; margin-bottom: 0.5rem; }
    input { width: 100%; padding: 0.5rem; margin-bottom: 1rem; }
    button { padding: 0.6rem 1.2rem; }
  </style>
</head>
<body>
  <form method="POST" action="/login">
    <h2>Login</h2>
    <label>
      Email
      <input type="email" name="email" required />
    </label>
    <label>
      Password
      <input type="password" name="password" required />
    </label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
